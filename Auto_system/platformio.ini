[platformio]
default_envs = giga_m7, giga_m4

[env]
platform = ststm32
framework = arduino
extra_scripts = post:tool/dfu_dual_core_upload.py
build_flags =
    -Iinclude
lib_deps = 
    pololu/Motoron @ ^1.3.0
    arduino-libraries/Servo @ ^1.2.1
    arduino-libraries/ArduinoMqttClient


[env:giga_m7]
board = giga_r1_m7
build_src_filter =
    +<*>
    -<M4/*>
; Double-tap reset before upload so the board is already in DFU mode.
; M7 uploads first and intentionally does not leave DFU; M4 leaves after upload.
upload_protocol = dfu
board_upload.disable_flushing = true
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
board_upload.require_upload_port = false
build_flags = 
    ${env.build_flags}
    -D CORE_CM7
    -Wl,--allow-multiple-definition
monitor_speed = 115200

[env:giga_m4]
board = giga_r1_m4
build_src_filter =
    +<*>
    -<M7/*>
    -<fsm/*>
    -<navigation/*>
; See the M7 upload note above.
upload_protocol = dfu
board_upload.disable_flushing = true
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
board_upload.require_upload_port = false
build_flags =
    ${env.build_flags}
    -D CORE_CM4
    -Wl,--allow-multiple-definition
monitor_speed = 115200
