<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450" role="img" aria-labelledby="title desc">
  <title id="title">Complete Robot FSM Diagram</title>
  <desc id="desc">Complete hierarchical finite state machine for the robot, including safety, base, grid, automatic events, remote events, stranded, revive, and return-home paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#243447"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#bc2f2f"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 34px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #5f6b7a; }
      .panel { fill: #ffffff; stroke: #d7deea; stroke-width: 2; rx: 12; ry: 12; }
      .safetyPanel { fill: #fff5f5; stroke: #df6b6b; stroke-width: 2; rx: 12; ry: 12; }
      .basePanel { fill: #effaf2; stroke: #39a263; stroke-width: 2; rx: 12; ry: 12; }
      .gridPanel { fill: #fff8e8; stroke: #d59a25; stroke-width: 2; rx: 12; ry: 12; }
      .eventPanel { fill: #f2f6ff; stroke: #6b84d6; stroke-width: 2; rx: 12; ry: 12; }
      .runtimePanel { fill: #f8f7ff; stroke: #8b72d8; stroke-width: 2; rx: 12; ry: 12; }
      .label { font: 700 22px Arial, sans-serif; fill: #1f2937; }
      .smallLabel { font: 700 16px Arial, sans-serif; fill: #253044; }
      .state { font: 700 16px Arial, sans-serif; fill: #111827; }
      .sub { font: 400 12px Arial, sans-serif; fill: #556274; }
      .event { font: 600 12px Arial, sans-serif; fill: #344054; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #667085; }
      .box { fill: #ffffff; stroke: #9aa7ba; stroke-width: 2; rx: 8; ry: 8; }
      .normal { fill: #ecfdf3; stroke: #29935b; }
      .danger { fill: #ffe7e7; stroke: #c93535; }
      .base { fill: #e8f8ef; stroke: #2f9a59; }
      .exit { fill: #eaf6ff; stroke: #2674a8; }
      .return { fill: #eef2ff; stroke: #5574d8; }
      .grid { fill: #fff1cd; stroke: #c48a16; }
      .align { fill: #f0ebff; stroke: #7857d5; }
      .plant { fill: #e9faf7; stroke: #209485; }
      .remote { fill: #eef4ff; stroke: #5077d8; }
      .auto { fill: #fff7ed; stroke: #c27416; }
      .line { fill: none; stroke: #243447; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #6b7280; stroke-width: 1.8; marker-end: url(#arrow); }
      .back { fill: none; stroke: #6b7280; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .emergency { fill: none; stroke: #bc2f2f; stroke-width: 2.3; stroke-dasharray: 8 5; marker-end: url(#arrowRed); }
      .eventLine { fill: none; stroke: #5077d8; stroke-width: 1.8; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1450"/>

  <text class="title" x="60" y="58">Complete Robot Hierarchical FSM</text>
  <text class="subtitle" x="60" y="86">Safety gate, mission states, base exit/return, grid exploration, planting, automatic events, remote events, and recovery paths.</text>

  <!-- Safety layer -->
  <rect class="safetyPanel" x="60" y="115" width="1680" height="170"/>
  <text class="label" x="90" y="152">Safety Layer</text>

  <rect class="box normal" x="170" y="185" width="230" height="64"/>
  <text class="state" x="285" y="211" text-anchor="middle">SafetyState::Normal</text>
  <text class="sub" x="285" y="232" text-anchor="middle">mission layer can update</text>

  <rect class="box danger" x="1325" y="178" width="260" height="78"/>
  <text class="state" x="1455" y="206" text-anchor="middle">SafetyState::EmergencyStop</text>
  <text class="sub" x="1455" y="227" text-anchor="middle">stop_all(); preserve mission state</text>
  <text class="sub" x="1455" y="246" text-anchor="middle">update() returns immediately</text>

  <path class="emergency" d="M400 214 C650 150, 1050 150, 1325 214"/>
  <text class="event" x="865" y="156" text-anchor="middle">kill switch, heartbeat timeout, remote stop/emergency/disable, drive not ready</text>

  <path class="soft" d="M1325 238 C1050 292, 650 292, 400 238"/>
  <text class="event" x="865" y="274" text-anchor="middle">safety restored: clearEmergencyStop() and re-enter current leaf state</text>

  <!-- Runtime integration -->
  <rect class="runtimePanel" x="60" y="315" width="1680" height="145"/>
  <text class="label" x="90" y="352">Runtime Loop: RobotApp::fsmLoop()</text>
  <rect class="box" x="90" y="378" width="1530" height="52"/>
  <text class="event" x="110" y="401">1 MQTT loop/register/status | 2 update heartbeat safety | 3 update kill/revive/IR/Lidar | 4 feed Navigator | 5 handle remote events</text>
  <text class="event" x="110" y="421">6 safety gate | 7 handle automatic events | 8 fsm.update() | 9 send seedPlanted | 10 update LED and status</text>
  <rect class="box" x="1640" y="378" width="70" height="52"/>
  <text class="state" x="1675" y="407" text-anchor="middle">10 ms</text>
  <text class="sub" x="1675" y="424" text-anchor="middle">delay</text>

  <!-- Mission layer -->
  <rect class="panel" x="60" y="500" width="1680" height="790"/>
  <text class="label" x="90" y="538">Mission Layer</text>

  <!-- Base region -->
  <rect class="basePanel" x="90" y="570" width="730" height="660"/>
  <text class="label" x="120" y="608">MissionState::Base</text>

  <rect class="box base" x="130" y="650" width="150" height="64"/>
  <text class="state" x="205" y="676" text-anchor="middle">BaseState::Idle</text>
  <text class="sub" x="205" y="697" text-anchor="middle">robot stopped</text>

  <rect class="box base" x="130" y="1080" width="150" height="64"/>
  <text class="state" x="205" y="1106" text-anchor="middle">BaseState::InsideBase</text>
  <text class="sub" x="205" y="1127" text-anchor="middle">mission complete</text>

  <rect class="box exit" x="350" y="620" width="360" height="245"/>
  <text class="state" x="530" y="648" text-anchor="middle">BaseState::ExitBase</text>

  <rect class="box" x="392" y="675" width="276" height="36"/>
  <text class="sub" x="530" y="698" text-anchor="middle">ExitBaseState::RequestClearance</text>

  <rect class="box" x="392" y="725" width="276" height="36"/>
  <text class="sub" x="530" y="748" text-anchor="middle">ExitBaseState::LineFollowToDoor</text>

  <rect class="box" x="392" y="775" width="276" height="36"/>
  <text class="sub" x="530" y="798" text-anchor="middle">ExitBaseState::WaitForDoor</text>

  <rect class="box" x="392" y="825" width="276" height="36"/>
  <text class="sub" x="530" y="848" text-anchor="middle">ExitBaseState::TraverseTunnel</text>

  <path class="line" d="M530 711 L530 725"/>
  <text class="event" x="655" y="721">exitClearanceReceived()</text>
  <path class="line" d="M530 761 L530 775"/>
  <text class="event" x="655" y="771">exitDoorDetected()</text>
  <path class="line" d="M530 811 L530 825"/>
  <text class="event" x="655" y="821">exitDoorOpened()</text>

  <rect class="box return" x="350" y="930" width="360" height="210"/>
  <text class="state" x="530" y="958" text-anchor="middle">BaseState::ReturnHome</text>

  <rect class="box" x="392" y="985" width="276" height="36"/>
  <text class="sub" x="530" y="1008" text-anchor="middle">ReturnState::NavigateToAirlock</text>

  <rect class="box" x="392" y="1035" width="276" height="36"/>
  <text class="sub" x="530" y="1058" text-anchor="middle">ReturnState::WaitForEntryDoor</text>

  <rect class="box" x="392" y="1085" width="276" height="36"/>
  <text class="sub" x="530" y="1108" text-anchor="middle">ReturnState::TraverseTunnel</text>

  <path class="line" d="M530 1021 L530 1035"/>
  <text class="event" x="655" y="1031">entryAirlockReached()</text>
  <path class="line" d="M530 1071 L530 1085"/>
  <text class="event" x="655" y="1081">entryDoorOpened()</text>

  <path class="line" d="M280 682 L350 695"/>
  <text class="event" x="315" y="665" text-anchor="middle">startMission()</text>
  <path class="soft" d="M205 1080 C235 970, 300 760, 350 705"/>
  <text class="event" x="250" y="900" text-anchor="middle">new run</text>
  <path class="line" d="M350 1112 L280 1112"/>
  <text class="event" x="315" y="1096" text-anchor="middle">baseReached()</text>

  <!-- Grid region -->
  <rect class="gridPanel" x="900" y="570" width="780" height="660"/>
  <text class="label" x="930" y="608">MissionState::Grid</text>

  <rect class="box grid" x="940" y="645" width="280" height="195"/>
  <text class="state" x="1080" y="673" text-anchor="middle">GridState::ExploreGrid</text>

  <rect class="box" x="970" y="705" width="220" height="38"/>
  <text class="sub" x="1080" y="729" text-anchor="middle">ExploreState::DriveGrid</text>

  <rect class="box" x="970" y="770" width="220" height="38"/>
  <text class="sub" x="1080" y="794" text-anchor="middle">ExploreState::QuerySoilStatus</text>

  <path class="line" d="M1080 743 L1080 770"/>
  <text class="event" x="1188" y="760">rfidDetected()</text>
  <path class="back" d="M970 790 C910 775, 910 725, 970 724"/>
  <text class="event" x="910" y="752" text-anchor="middle">infertile / timeout</text>

  <rect class="box align" x="1310" y="645" width="280" height="195"/>
  <text class="state" x="1450" y="673" text-anchor="middle">GridState::Align</text>

  <rect class="box" x="1340" y="705" width="220" height="38"/>
  <text class="sub" x="1450" y="729" text-anchor="middle">AlignState::SearchRFID</text>

  <rect class="box" x="1340" y="770" width="220" height="38"/>
  <text class="sub" x="1450" y="794" text-anchor="middle">AlignState::FineAdjustToHole</text>

  <path class="line" d="M1220 789 L1310 724"/>
  <text class="event" x="1265" y="742" text-anchor="middle">fertile &amp; seeds remain</text>
  <path class="line" d="M1450 743 L1450 770"/>
  <text class="event" x="1578" y="760">SEARCH_RFID_MS</text>

  <rect class="box plant" x="1310" y="930" width="280" height="245"/>
  <text class="state" x="1450" y="958" text-anchor="middle">GridState::Plant</text>

  <rect class="box" x="1340" y="990" width="220" height="38"/>
  <text class="sub" x="1450" y="1014" text-anchor="middle">PlantState::OpenHopper</text>

  <rect class="box" x="1340" y="1048" width="220" height="38"/>
  <text class="sub" x="1450" y="1072" text-anchor="middle">PlantState::DropSeed</text>

  <rect class="box" x="1340" y="1106" width="220" height="38"/>
  <text class="sub" x="1450" y="1130" text-anchor="middle">PlantState::VerifyDrop</text>

  <path class="line" d="M1450 808 L1450 930"/>
  <text class="event" x="1570" y="880">FINE_ADJUST_MS</text>
  <path class="line" d="M1450 1028 L1450 1048"/>
  <text class="event" x="1570" y="1042">OPEN_HOPPER_MS</text>
  <path class="line" d="M1450 1086 L1450 1106"/>
  <text class="event" x="1570" y="1100">DROP_SEED_MS</text>
  <path class="soft" d="M1340 1130 C1220 1190, 1000 930, 1080 840"/>
  <text class="event" x="1160" y="1185" text-anchor="middle">planting done, seeds remain</text>
  <path class="line" d="M1590 1130 C1648 1145, 1670 1175, 1670 1218 C1670 1260, 1440 1265, 730 1120"/>
  <text class="event" x="1425" y="1260" text-anchor="middle">no seeds remaining</text>

  <!-- Cross-region transitions -->
  <path class="line" d="M710 843 C770 820, 845 760, 940 724"/>
  <text class="event" x="825" y="795" text-anchor="middle">mainArenaReached()</text>
  <path class="line" d="M940 740 C830 790, 770 900, 710 1003"/>
  <text class="event" x="826" y="906" text-anchor="middle">arena timeout / emergency return</text>

  <!-- Stranded and revived -->
  <rect class="box danger" x="930" y="1040" width="230" height="68"/>
  <text class="state" x="1045" y="1068" text-anchor="middle">MissionState::Stranded</text>
  <text class="sub" x="1045" y="1089" text-anchor="middle">stop; wait for revive</text>

  <rect class="box" x="930" y="1145" width="230" height="68"/>
  <text class="state" x="1045" y="1173" text-anchor="middle">MissionState::Revived</text>
  <text class="sub" x="1045" y="1194" text-anchor="middle">pause, then return home</text>

  <path class="emergency" d="M1080 840 C1050 920, 1040 985, 1045 1040"/>
  <text class="event" x="975" y="945" text-anchor="middle">stranded</text>
  <path class="line" d="M1045 1108 L1045 1145"/>
  <text class="event" x="1100" y="1132">revive</text>
  <path class="line" d="M930 1180 C820 1180, 760 1110, 710 1040"/>
  <text class="event" x="806" y="1162" text-anchor="middle">REVIVE_PAUSE_MS</text>

  <!-- Event source panels -->
  <rect class="eventPanel" x="60" y="1320" width="540" height="95"/>
  <text class="smallLabel" x="90" y="1348">Remote / MQTT Events</text>
  <text class="tiny" x="90" y="1372">heartbeat enable=1 starts safety; stop/emergency/disable blocks motion</text>
  <text class="tiny" x="90" y="1390">openAirlockReply, isFertileReply, rfid, return, stranded, revive, base_reached</text>

  <rect class="eventPanel auto" x="630" y="1320" width="540" height="95"/>
  <text class="smallLabel" x="660" y="1348">Automatic Events</text>
  <text class="tiny" x="660" y="1372">Lidar detects near door at 18 cm, open path at 45 cm after stable delay</text>
  <text class="tiny" x="660" y="1390">Tunnel timers, line visibility, airlock accepted flags, and stranded flags</text>

  <rect class="eventPanel" x="1200" y="1320" width="540" height="95"/>
  <text class="smallLabel" x="1230" y="1348">Navigator / Hardware Actions</text>
  <text class="tiny" x="1230" y="1372">driveExitLine, driveTunnel, driveGridExplore, driveFineAdjust, driveReturnHome</text>
  <text class="tiny" x="1230" y="1390">RFID reader, IR line array, Lidar1 primary obstacle distance, M4 drive proxy</text>

  <path class="eventLine" d="M330 1320 C360 1190, 385 900, 392 695"/>
  <path class="eventLine" d="M900 1320 C920 1150, 965 880, 1080 789"/>
  <path class="eventLine" d="M1470 1320 C1485 1240, 1465 1190, 1450 1144"/>

</svg>
