<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
  <title id="title">Term 3 Robot Hierarchical FSM with Base and Grid Regions</title>
  <desc id="desc">A hierarchical FSM diagram where the mission layer is split into Base and Grid regions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#263241"/>
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #5c6678; }
      .panel { fill: #ffffff; stroke: #d7deea; stroke-width: 2; rx: 10; ry: 10; }
      .base-panel { fill: #eef9f2; stroke: #39a263; stroke-width: 2; rx: 10; ry: 10; }
      .grid-panel { fill: #fff8e8; stroke: #d29a20; stroke-width: 2; rx: 10; ry: 10; }
      .label { font: 700 21px Arial, sans-serif; fill: #1f2937; }
      .state { font: 700 17px Arial, sans-serif; fill: #111827; }
      .sub { font: 400 13px Arial, sans-serif; fill: #526071; }
      .event { font: 600 13px Arial, sans-serif; fill: #344054; }
      .box { fill: #ffffff; stroke: #9aa7ba; stroke-width: 2; rx: 8; ry: 8; }
      .safety { fill: #fff0f0; stroke: #d54848; }
      .danger { fill: #ffe1e1; stroke: #c93535; }
      .base { fill: #e9f8ef; stroke: #2f9a59; }
      .grid { fill: #fff3d6; stroke: #d09a26; }
      .plant { fill: #eaf8f6; stroke: #209485; }
      .align { fill: #f1ecff; stroke: #7857d5; }
      .return { fill: #f0f4ff; stroke: #5574d8; }
      .line { fill: none; stroke: #263241; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #697586; stroke-width: 1.8; marker-end: url(#arrow); }
      .emergency { fill: none; stroke: #c93535; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1500" height="1040"/>
  <text class="title" x="55" y="58">Term 3 Robot Hierarchical FSM</text>
  <text class="subtitle" x="55" y="86">MissionState is split into Base and Grid. Each region owns its own phases and local substates.</text>

  <rect class="panel" x="50" y="120" width="1400" height="130"/>
  <text class="label" x="75" y="154">Safety Layer</text>
  <rect class="box safety" x="155" y="177" width="230" height="54"/>
  <text class="state" x="270" y="201" text-anchor="middle">Normal</text>
  <text class="sub" x="270" y="220" text-anchor="middle">runs mission layer</text>
  <rect class="box danger" x="1115" y="170" width="240" height="68"/>
  <text class="state" x="1235" y="196" text-anchor="middle">EmergencyStop</text>
  <text class="sub" x="1235" y="218" text-anchor="middle">stop all motors</text>
  <path class="emergency" d="M385 204 C610 145, 880 145, 1115 204"/>
  <text class="event" x="750" y="154" text-anchor="middle">kill switch triggered</text>
  <path class="soft" d="M1115 226 C880 278, 610 278, 385 226"/>
  <text class="event" x="750" y="280" text-anchor="middle">kill switch released</text>

  <rect class="panel" x="50" y="310" width="1400" height="660"/>
  <text class="label" x="75" y="345">Mission Layer</text>

  <rect class="base-panel" x="80" y="375" width="610" height="520"/>
  <text class="label" x="105" y="410">MissionState::Base</text>

  <rect class="box base" x="115" y="440" width="145" height="58"/>
  <text class="state" x="188" y="465" text-anchor="middle">Idle</text>
  <text class="sub" x="188" y="485" text-anchor="middle">waiting</text>

  <rect class="box base" x="310" y="420" width="250" height="205"/>
  <text class="state" x="435" y="448" text-anchor="middle">BaseState::ExitBase</text>
  <rect class="box" x="338" y="470" width="194" height="28"/>
  <text class="sub" x="435" y="489" text-anchor="middle">RequestClearance</text>
  <rect class="box" x="338" y="506" width="194" height="28"/>
  <text class="sub" x="435" y="525" text-anchor="middle">LineFollowToDoor</text>
  <rect class="box" x="338" y="542" width="194" height="28"/>
  <text class="sub" x="435" y="561" text-anchor="middle">WaitForDoor</text>
  <rect class="box" x="338" y="578" width="194" height="28"/>
  <text class="sub" x="435" y="597" text-anchor="middle">TraverseTunnel</text>

  <rect class="box return" x="310" y="680" width="250" height="165"/>
  <text class="state" x="435" y="708" text-anchor="middle">BaseState::ReturnHome</text>
  <rect class="box" x="338" y="730" width="194" height="28"/>
  <text class="sub" x="435" y="749" text-anchor="middle">NavigateToAirlock</text>
  <rect class="box" x="338" y="766" width="194" height="28"/>
  <text class="sub" x="435" y="785" text-anchor="middle">WaitForEntryDoor</text>
  <rect class="box" x="338" y="802" width="194" height="28"/>
  <text class="sub" x="435" y="821" text-anchor="middle">TraverseTunnel</text>

  <rect class="box base" x="115" y="760" width="145" height="58"/>
  <text class="state" x="188" y="785" text-anchor="middle">InsideBase</text>
  <text class="sub" x="188" y="805" text-anchor="middle">complete</text>

  <rect class="grid-panel" x="760" y="375" width="610" height="520"/>
  <text class="label" x="785" y="410">MissionState::Grid</text>

  <rect class="box grid" x="810" y="430" width="230" height="145"/>
  <text class="state" x="925" y="458" text-anchor="middle">GridState::ExploreGrid</text>
  <rect class="box" x="838" y="482" width="174" height="30"/>
  <text class="sub" x="925" y="502" text-anchor="middle">DriveGrid</text>
  <rect class="box" x="838" y="522" width="174" height="30"/>
  <text class="sub" x="925" y="542" text-anchor="middle">QuerySoilStatus</text>

  <rect class="box align" x="1090" y="430" width="230" height="145"/>
  <text class="state" x="1205" y="458" text-anchor="middle">GridState::Align</text>
  <rect class="box" x="1118" y="482" width="174" height="30"/>
  <text class="sub" x="1205" y="502" text-anchor="middle">SearchRFID</text>
  <rect class="box" x="1118" y="522" width="174" height="30"/>
  <text class="sub" x="1205" y="542" text-anchor="middle">FineAdjustToHole</text>

  <rect class="box plant" x="1090" y="670" width="230" height="170"/>
  <text class="state" x="1205" y="698" text-anchor="middle">GridState::Plant</text>
  <rect class="box" x="1118" y="722" width="174" height="30"/>
  <text class="sub" x="1205" y="742" text-anchor="middle">OpenHopper</text>
  <rect class="box" x="1118" y="762" width="174" height="30"/>
  <text class="sub" x="1205" y="782" text-anchor="middle">DropSeed</text>
  <rect class="box" x="1118" y="802" width="174" height="30"/>
  <text class="sub" x="1205" y="822" text-anchor="middle">VerifyDrop</text>

  <rect class="box danger" x="810" y="735" width="175" height="58"/>
  <text class="state" x="898" y="760" text-anchor="middle">Stranded</text>
  <text class="sub" x="898" y="780" text-anchor="middle">await revive</text>
  <rect class="box" x="810" y="820" width="175" height="58"/>
  <text class="state" x="898" y="845" text-anchor="middle">Revived</text>
  <text class="sub" x="898" y="865" text-anchor="middle">return home</text>

  <path class="line" d="M260 470 L310 470"/>
  <text class="event" x="286" y="458" text-anchor="middle">start</text>
  <path class="line" d="M560 520 C635 485, 690 485, 760 500"/>
  <text class="event" x="662" y="472" text-anchor="middle">mainArenaReached()</text>
  <path class="line" d="M1040 502 L1090 502"/>
  <text class="event" x="1065" y="490" text-anchor="middle">fertile</text>
  <path class="line" d="M1205 575 L1205 670"/>
  <text class="event" x="1258" y="626">aligned</text>
  <path class="soft" d="M1090 815 C985 890, 845 625, 925 575"/>
  <text class="event" x="990" y="892" text-anchor="middle">seeds remain</text>
  <path class="line" d="M1090 755 C910 720, 760 720, 560 750"/>
  <text class="event" x="815" y="704" text-anchor="middle">no seeds / return</text>
  <path class="emergency" d="M925 575 C850 650, 700 690, 560 730"/>
  <text class="event" x="748" y="646" text-anchor="middle">emergency warning</text>
  <path class="line" d="M310 790 L260 790"/>
  <text class="event" x="286" y="778" text-anchor="middle">baseReached()</text>
  <path class="emergency" d="M925 575 C885 645, 875 690, 898 735"/>
  <text class="event" x="845" y="668" text-anchor="middle">stranded</text>
  <path class="line" d="M898 793 L898 820"/>
  <text class="event" x="962" y="812">revive</text>
  <path class="line" d="M810 850 C690 860, 610 830, 560 790"/>
  <text class="event" x="675" y="850" text-anchor="middle">return home</text>

  <rect class="panel" x="1045" y="905" width="325" height="50"/>
  <text class="event" x="1070" y="927">Serial test: s c d o a f e o b</text>
  <text class="sub" x="1070" y="945">start, exit base, plant, return to base</text>
</svg>
